<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 12px;
            margin: 0;
        }

        h2 {
            margin-top: 0;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        textarea {
            width: 100%;
            height: 200px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 11px;
            border: 1px solid #ddd;
        }

        .status-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
            border: 1px solid #eee;
        }

        .success {
            color: green;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>🔍 Nano Auditor</h2>
    <script type="module" src="sidepanel.js"></script>

    <div id="setup">
        <p style="font-size: 12px; color: #555;">
            Upload a CSV of URLs to audit. The extension will visit each page, run checks, automatically download the EARL report, and open the W3C Report Tool to view the results.
        </p>
        <p style="margin-bottom: 5px; font-size: 12px;">1. Load URLs (CSV with 'url' column):</p>
        <input type="file" id="csvFile" accept=".csv" />
        <button id="startBtn" disabled>Start Batch Audit</button>
    </div>

    <div id="statusArea" class="status-box" style="display:none;">
        <strong>Progress:</strong> <span id="progress">0/0</span><br>
        <div style="margin-top:4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            <strong>Current:</strong> <span id="currentUrl">...</span>
        </div>
    </div>

    <textarea id="log" readonly placeholder="Audit logs will appear here..."></textarea>
    <button id="downloadBtn" style="display:none; background: #28a745;">Download Report Data</button>
</body>

</html>
