<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SC 4.1.2 | Accessibility Test Lab</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
        }

        .test-case {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>SC 4.1.2 Test Corpus</h1>

    <section>
        <h2>Group A</h2>

        <div class="test-case" data-rule="4.1.2-meaningful-name" data-failure="Filename">
            <h3>Item 1</h3>
            <button aria-label="icon-v2-final.png">
                <img src="https://placehold.co/20x20" alt="">
            </button>
        </div>

        <div class="test-case" data-rule="4.1.2-meaningful-name" data-failure="Placeholder">
            <h3>Item 2</h3>
            <button aria-label="button">
                <svg width="20" height="20">
                    <rect width="20" height="20" fill="blue" />
                </svg>
            </button>
            <button aria-label="click here">
                Action
            </button>
        </div>

        <div class="test-case" data-rule="4.1.2-meaningful-name" data-failure="Gibberish">
            <h3>Item 3</h3>
            <button aria-label="12345">
                Next
            </button>
            <button aria-label="div_883_wrapper">
                Settings
            </button>
        </div>
    </section>

    <section>
        <h2>Group B</h2>

        <div class="test-case" data-rule="4.1.2-meaningful-name" data-failure="None">
            <h3>Item 4</h3>
            <button aria-label="Search Website">
                🔍
            </button>
        </div>

        <div class="test-case" data-rule="4.1.2-meaningful-name" data-failure="None">
            <h3>Item 5</h3>
            <button>Submit Order</button>
        </div>
    </section>

</body>

</html>
