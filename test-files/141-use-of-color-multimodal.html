<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC 1.4.1 Multimodal | Accessibility Test Lab</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
        }

        .example-box {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
            background: #fff;
        }

        .legend {
            margin-top: 10px;
            font-size: 0.9rem;
        }

        h3 {
            margin-top: 0;
        }

        svg {
            background: #f9f9f9;
            border: 1px solid #eee;
        }
    </style>
</head>

<body>
    <h1>SC 1.4.1: Use of Color (Multimodal)</h1>
    <p>Automated test corpus for visual color dependence.</p>

    <div class="test-case" data-rule="1.4.1-images" data-failure="Color-Only Chart">
        <h3>Test Case 1: Bar Chart</h3>
        <div class="example-box">
            <svg width="300" height="150" role="img" aria-label="Sales vs Cost Data">
                <rect x="50" y="50" width="50" height="100" fill="red"></rect>
                <rect x="150" y="20" width="50" height="130" fill="blue"></rect>

                <line x1="20" y1="150" x2="280" y2="150" stroke="black" stroke-width="2" />
                <line x1="20" y1="10" x2="20" y2="150" stroke="black" stroke-width="2" />
            </svg>

            <div class="legend">
                <strong>Legend:</strong>
                <span style="color: red">■ Sales</span>
                <span style="color: blue">■ Cost</span>
            </div>
        </div>
    </div>

    <div class="test-case" data-rule="1.4.1-images" data-failure="None">
        <h3>Test Case 2: Bar Chart</h3>
        <div class="example-box">
            <svg width="300" height="150" role="img" aria-label="Growth Data">
                <rect x="50" y="50" width="50" height="100" fill="green"></rect>
                <text x="65" y="140" fill="white" font-weight="bold">Q1</text>

                <rect x="150" y="20" width="50" height="130" fill="orange"></rect>
                <text x="165" y="140" fill="black" font-weight="bold">Q2</text>

                <line x1="20" y1="150" x2="280" y2="150" stroke="black" stroke-width="2" />
                <line x1="20" y1="10" x2="20" y2="150" stroke="black" stroke-width="2" />
            </svg>
        </div>
    </div>
    <div>
        <h3>Test Case 3: Bar Chart</h3>
        <img src="https://ichef.bbci.co.uk/images/ic/1200xn/p0fbqyln.png"
            alt="chart depecting the eye color of year 7 and year 8 students" />
    </div>
</body>

</html>
