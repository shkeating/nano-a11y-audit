<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SC 1.3.1 Test: Form Labels</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
        }

        .form-row {
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .visual-label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <h1>Registration Form</h1>

    <form>
        <div class="form-row">
            <div class="visual-label">First Name</div>
            <input type="text" name="fname">
        </div>

        <div class="form-row">
            <span style="font-weight:bold; margin-right: 10px;">Email Address:</span>
            <input type="text" name="email">
        </div>

        <div class="form-row">
            <label for="wrong-id">Phone Number</label>
            <input type="text" id="phone-input" name="phone">
        </div>

        <div class="form-row">
            <label for="city">City</label>
            <input type="text" id="city" name="city">
        </div>

        <div class="form-row">
            <span id="zip-label" class="visual-label">Zip Code</span>
            <input type="text" aria-labelledby="zip-label" name="zip">
        </div>

        <div class="form-row">
            <div class="visual-label">Search</div>
            <input type="text" aria-label="Search" name="q">
        </div>
    </form>

</body>

</html>
