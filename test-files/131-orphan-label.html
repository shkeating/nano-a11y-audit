<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SC 1.3.1 | Accessibility Test Lab</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
        }

        .test-case {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        .pseudo-label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <h1>SC 1.3.1 Test Corpus</h1>

    <section>
        <h2>Test Set 1</h2>

        <div class="test-case" data-rule="1.3.1-orphaned-label" data-failure="Div Label">
            <h3>Case A</h3>
            <div class="form-group">
                <div class="pseudo-label">First Name</div>
                <input type="text">
            </div>
        </div>

        <div class="test-case" data-rule="1.3.1-orphaned-label" data-failure="Span Preceding">
            <h3>Case B</h3>
            <div class="form-group">
                <span style="font-weight:bold; margin-right: 10px;">Email Address:</span>
                <input type="text">
            </div>
        </div>

        <div class="test-case" data-rule="1.3.1-orphaned-label" data-failure="Broken For Attribute">
            <h3>Case C</h3>
            <div class="form-group">
                <label for="wrong-id">Phone Number</label>
                <input type="text" id="phone">
            </div>
        </div>
    </section>

    <section>
        <h2>Test Set 2</h2>

        <div class="test-case" data-rule="1.3.1-orphaned-label" data-failure="None">
            <h3>Case D</h3>
            <label for="city">City</label>
            <input type="text" id="city">
        </div>

        <div class="test-case" data-rule="1.3.1-orphaned-label" data-failure="None">
            <h3>Case E</h3>
            <span id="zip-label" class="pseudo-label">Zip Code</span>
            <input type="text" aria-labelledby="zip-label">
        </div>

        <div class="test-case" data-rule="1.3.1-orphaned-label" data-failure="None">
            <h3>Case F</h3>
            <div class="pseudo-label">Search</div>
            <input type="text" aria-label="Search">
        </div>
    </section>

</body>

</html>
